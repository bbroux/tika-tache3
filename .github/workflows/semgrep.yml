name: Semgrep

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # Checkout project source
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/java --error
