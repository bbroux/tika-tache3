name: Semgrep

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # Checkout project source
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - run: semgrep scan --config p/java --json --output semgrep-report.json --baseline-commit e4bd0cf676d63fbecbfa4f3ab8d4140e20fb8d9e --error

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-initial-report
          path: semgrep-report.json

